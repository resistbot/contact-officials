# Overrides contact-congress's H001104.yaml (Husted). Upstream config
# targets an Elementor Pro Forms widget; the live page has migrated to
# Gravity Forms entirely (different field ids, submit button, and hidden
# fields) -- a plugin change, not just reshuffled ids. All ids/options
# below were re-derived from the live DOM.
#
# Data-shape changes from the old config, not just id renames:
#   - STATE select values are now full state names ("Ohio"), not postal
#     abbreviations.
#   - TOPIC select values are now literal option text ("Agriculture"), not
#     abbreviated codes -- value equals label for every option now.
#   - The compound Address field exposes an optional Address Line 2
#     subfield (input_2_6_2) not present before; left unfilled here since
#     there is no corresponding field mapping today.
#
# contact-congress is upstream and unlikely to accept this fix, so it
# lives here instead.
#
# The post-submit success block below is carried over from the old
# Elementor-based config and is UNVERIFIED against Gravity Forms' actual
# confirmation markup/behavior -- confirm via a live run before treating
# this as fully fixed.
bioguide: H001104
contact_form:
  method: post
  action: ""
  steps:
  - visit: "https://www.husted.senate.gov/contact-jon/"
  - fill_in:
        - name: input_44
          selector: "#input_2_44"
          value: $NAME_PREFIX
          required: false
        - name: input_2
          selector: "#input_2_2"
          value: $NAME_FIRST
          required: true
        - name: input_3
          selector: "#input_2_3"
          value: $NAME_LAST
          required: true
        - name: input_6.1
          selector: "#input_2_6_1"
          value: $ADDRESS_STREET
          required: true
        - name: input_6.3
          selector: "#input_2_6_3"
          value: $ADDRESS_CITY
          required: true
        - name: input_6.5
          selector: "#input_2_6_5"
          value: $ADDRESS_ZIP5
          required: true
        - name: input_41
          selector: "#input_2_41"
          value: $PHONE
          required: true
        - name: input_9
          selector: "#input_2_9"
          value: $EMAIL
          required: true
        - name: input_11
          selector: "#input_2_11"
          value: $SUBJECT
          required: true
        - name: input_12
          selector: "#input_2_12"
          value: $MESSAGE
          required: true
  - select:
