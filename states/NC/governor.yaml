contact_form:
  # Site migrated its contact form off the old Drupal webform to an
  # embedded iQ Extranet EForm hosted on a separate subdomain
  # (oce-connect.governor.nc.gov). The public-facing page now only embeds
  # it in an iframe; visiting the iframe's src directly gets the same
  # form without cross-frame handling. Also carries a visible reCAPTCHA
  # v2 checkbox that wasn't present in the prior version of this form.
  steps:
    - visit: "https://oce-connect.governor.nc.gov/iqextranet/EForm.aspx?__cid=FSL_NCGOV&__fid=100004&iframe=Y"
    - select:
        - name: "prefix"
          selector: "#qi_1_prefix"
          value: $NAME_PREFIX
          required: true
          options:
            "Imam": Imam
            "Miss": Miss
            "Mr.": Mr.
            "Ms.": Ms.
            "Pastor": Pastor
            "Rabbi": Rabbi
            "Rev. Dr.": Rev. Dr.
            "Reverend": Reverend
    - fill_in:
        - name: "first_name"
          selector: "#qi_1_first_name"
          value: $NAME_FIRST
          required: true
        - name: "last_name"
          selector: "#qi_1_last_name"
          value: $NAME_LAST
          required: true
        - name: "address_1"
          selector: "#qi_1_addr_1"
          value: $ADDRESS_STREET
          required: true
        - name: "city"
          selector: "#qi_1_city"
          value: $ADDRESS_CITY
          required: true
    - select:
        - name: "state"
          selector: "#qi_1_state"
          value: "$ADDRESS_STATE_FULL"
          required: true
          options: US_STATES
    - fill_in:
        - name: "zip"
          selector: "#qi_1_zip"
          value: $ADDRESS_ZIP5
          required: true
        - name: "phone"
          selector: "#qi_1_cphone"
          value: $PHONE
          required: true
        - name: "email"
          selector: "#qi_1_email"
          value: $EMAIL
          required: true
    - select:
        - name: "issue"
          selector: "#qi_2"
          value: "Other"
          required: true
          options:
            "Disaster Recovery": Disaster Recovery
            "Education": Education
            "Environment": Environment
            "HealthCare": HealthCare
            "Infrastructure": Infrastructure
            "Jobs/Economy": Jobs/Economy
            "Military Veterans": Military Veterans
            "Public Safety": Public Safety
            "Transportation/Eminent Domain": Transportation/Eminent Domain
            "Workforce Development": Workforce Development
            "Other": Other
    - fill_in:
        - name: "message"
          selector: "#qi_3"
          value: $MESSAGE
          required: true
    - recaptcha:
        - value: true
          callback: "captchaSuccess"
    - click_on:
        - name: "submit"
          value: "Submit"
          selector: "#btn_submit"
  success:
    body:
      contains: "Summary of Information"
